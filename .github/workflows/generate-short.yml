name: Generate Baburao Comedy Short

on:
  workflow_dispatch:
  schedule:
    # 09:00 Asia/Kolkata = 03:30 UTC
    - cron: "30 3 * * *"

permissions:
  contents: write

concurrency:
  group: baburao-daily-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Generate short
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID || 'zai.glm-4.7-flash' }}
        run: python src/generate_script.py

      - name: Commit generated output
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain output/)" ]; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          git commit -m "chore: generate daily comedy short"
          git push
