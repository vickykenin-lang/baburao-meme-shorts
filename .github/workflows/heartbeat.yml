name: Babu Rao Heartbeat

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: baburao-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run heartbeat tests
        run: python -m unittest tests.test_heartbeat

      - name: Generate heartbeat evidence
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: python src/heartbeat.py

      - name: Commit heartbeat evidence
        run: |
          if git diff --quiet -- runtime/heartbeat.json && [ -z "$(git status --porcelain runtime/heartbeat.json)" ]; then
            echo "No heartbeat change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/heartbeat.json
          git commit -m "chore: update Babu Rao heartbeat evidence"
          git pull --rebase origin main
          git push
